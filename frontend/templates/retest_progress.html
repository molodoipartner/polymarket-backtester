{% extends "base.html" %}
{% block title %}Retest progress - {{ app_name }}{% endblock %}
{% block content %}
<section id="retest-progress" class="panel mx-auto max-w-2xl" data-events-url="/api/group-jobs/{{ job.id }}/events" data-cancel-url="/api/group-jobs/{{ job.id }}/cancel">
  <div class="section-title"><div><p class="eyebrow">Strategy retest</p><h1>Preparing historical data</h1></div><button id="retest-cancel" class="danger" type="button">Stop / Cancel</button></div>
  <p id="retest-status" class="mt-3 muted">Connecting to the progress stream...</p>
  <div class="progress-track mt-6"><div id="retest-progress-bar" class="progress-fill" style="width:5%"></div></div>
  <p id="retest-request-count" class="mt-4 text-center text-lg">API requests: 0 of 0</p>
  <div id="retest-live-log" class="live-log mt-5"></div>
</section>
{% endblock %}
{% block scripts %}<script>initRetestProgress();</script>{% endblock %}
