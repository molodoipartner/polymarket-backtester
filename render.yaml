services:
  - type: web
    name: polymarket-backtester
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.app:app --host 0.0.0.0 --port $PORT
    disk:
      name: polymarket-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_ROOT
        value: /var/data/polymarket-backtester
      - key: WORKERS
        value: 1
      - key: LIVE_MONITOR_HISTORY_MEMORY_LIMIT
        value: 1800
      - key: LIVE_MONITOR_SUBSCRIBER_QUEUE_SIZE
        value: 2
      - key: LIVE_MONITOR_STREAM_HISTORY_LIMIT
        value: 60
      - key: LIVE_MONITOR_SAMPLE_WRITE_QUEUE_SIZE
        value: 500
      - key: LIVE_MONITOR_DISCONNECT_PERIOD_LIMIT
        value: 200
      - key: LIVE_MONITOR_SAVED_PREVIEW_CACHE_LIMIT
        value: 16
      - key: POLYMARKET_CLOB_URL
        value: https://clob.polymarket.com
      - key: POLYMARKET_CHAIN_ID
        value: 137
      - key: POLYMARKET_SIGNATURE_TYPE
        value: 1
      - key: SIGNATURE_TYPE
        value: 1
      - key: POLYMARKET_LIVE_TRADING_ENABLED
        value: true
      - key: POLYMARKET_LIVE_ORDER_AMOUNT
        value: 1
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_SECRET
        generateValue: true
      - key: EXPORT_TOKEN
        generateValue: true
      - key: USERNAME
        sync: false
      - key: PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: PROXY_ADDRESS
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: API_PASSPHRASE
        sync: false
      - key: POLYMARKET_PRIVATE_KEY
        sync: false
      - key: POLYMARKET_PROXY_ADDRESS
        sync: false
      - key: POLYMARKET_FUNDER
        sync: false
      - key: POLYMARKET_API_KEY
        sync: false
      - key: POLYMARKET_API_SECRET
        sync: false
      - key: POLYMARKET_API_PASSPHRASE
        sync: false
